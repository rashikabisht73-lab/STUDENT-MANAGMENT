<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Link our CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <h1>🎓 Student Management System</h1>
        <p>Add, view and manage student records easily</p>
    </header>

    <main class="container">

        <!-- ===== FORM SECTION ===== -->
        <section class="card">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">-- Select Course --</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="B.Com">B.Com</option>
                        <option value="BBA">BBA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="e.g. rahul@example.com" required>
                </div>

                <!-- Message area for errors / success -->
                <p id="message" class="message"></p>

                <button type="submit" class="btn">➕ Add Student</button>
            </form>
        </section>

        <!-- ===== TABLE SECTION ===== -->
        <section class="card">
            <div class="table-header">
                <h2>Student Records</h2>
                <span id="count" class="badge">0 Students</span>
            </div>

            <!-- Search box -->
            <input type="text" id="search" class="search" placeholder="🔍 Search by name, course or email...">

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <!-- Rows will be added here by JavaScript -->
                    <tbody id="studentTable"></tbody>
                </table>
            </div>

            <!-- Shown when there are no students -->
            <p id="emptyMessage" class="empty">No students added yet. Use the form to add one!</p>
        </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>Made with ❤️ using HTML, CSS &amp; JavaScript</p>
    </footer>

    <!-- Link our JavaScript file (at the end so the page loads first) -->
    <script src="script.js"></script>
</body>
</html>
